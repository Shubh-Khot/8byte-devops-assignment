# Runs on every pull request. Nothing here deploys anything or touches AWS,
# so it is safe to run on PRs from forks.
#
# Jobs are split rather than chained into one long script so that a failure
# tells you which class of problem you have without reading the log, and so
# the slow ones (image build, Trivy) run alongside the fast ones.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A second push to the same PR cancels the first. Without this, a branch with
# five quick pushes burns five full runs and the queue backs up behind them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install ruff
        run: pip install ruff==0.8.4

      - name: Check formatting
        run: ruff format --check app/

      - name: Lint
        run: ruff check --output-format=github app/

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Run unit tests
        working-directory: app
        run: pytest -m "not integration" --cov=. --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-unit
          path: app/coverage.xml
          retention-days: 7

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest

    # A real Postgres, not a mock or SQLite. Testing against SQLite and
    # deploying against Postgres is how you find out in production that your
    # migration used a type SQLite silently accepted.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tasksdb
          POSTGRES_USER: tasks
          POSTGRES_PASSWORD: ci-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasks -d tasksdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: tasksdb
      DB_USER: tasks
      DB_PASSWORD: ci-local-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Run integration tests
        working-directory: app
        run: pytest -m integration -v

  dependency-scan:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      # Audits the pinned runtime dependencies against the Python Advisory
      # Database. Runtime only: a CVE in pytest cannot reach production.
      - name: Audit runtime dependencies
        run: pip-audit --requirement app/requirements.txt --strict --desc

  image-scan:
    name: Container image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: task-api:pr-${{ github.event.pull_request.number || github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_SHA=${{ github.sha }}

      # Two Trivy passes on purpose.
      #
      # The first is informational and always passes: it produces the SARIF
      # that lands in the Security tab, so findings are tracked over time.
      # The second is the gate, and only fails on HIGH/CRITICAL that have a
      # fix available. Failing on unfixable CVEs in the base image just
      # teaches people to add --exit-code 0.
      - name: Scan image (report)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: task-api:pr-${{ github.event.pull_request.number || github.run_id }}
          format: sarif
          output: trivy-results.sarif
          severity: LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

      - name: Scan image (gate on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: task-api:pr-${{ github.event.pull_request.number || github.run_id }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Format check
        run: terraform fmt -check -recursive terraform/

      # -backend=false so validation needs no AWS credentials at all. The real
      # plan runs in infra.yml, which does authenticate.
      - name: Validate every root and module
        run: |
          set -e
          for dir in terraform/bootstrap terraform/envs/* terraform/modules/*; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false >/dev/null
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

      - name: Static analysis (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/
          soft_fail: true # advisory for now; flip to hard fail once the backlog is clear

  # A single job the branch protection rule can require, instead of listing
  # every job above by name and having to update the rule each time one is added.
  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, dependency-scan, image-scan, terraform]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"failure"\|"result": *"cancelled"'; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."

  notify:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [ci-passed]
    # Only for main. A failing PR already notifies its author on the PR page;
    # a broken main branch is everyone's problem and belongs in the channel.
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Post to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "No Slack webhook configured; skipping."
            exit 0
          fi
          curl -sS -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            -d @- <<EOF
          {
            "text": ":x: CI failed on main",
            "blocks": [
              {
                "type": "section",
                "text": {
                  "type": "mrkdwn",
                  "text": "*CI failed on \`main\`*\n*Commit:* \`${GITHUB_SHA:0:7}\` by ${GITHUB_ACTOR}\n*Message:* $(git log -1 --pretty=%s 2>/dev/null || echo 'n/a')"
                }
              },
              {
                "type": "actions",
                "elements": [
                  {
                    "type": "button",
                    "text": { "type": "plain_text", "text": "View run" },
                    "url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                  }
                ]
              }
            ]
          }
          EOF
