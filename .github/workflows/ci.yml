name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tasksdb
          POSTGRES_USER: tasks
          POSTGRES_PASSWORD: ci-local-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasks -d tasksdb"
          --health-interval 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_NAME: tasksdb
      DB_USER: tasks
      DB_PASSWORD: ci-local-password

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Lint
        run: |
          ruff format --check app/
          ruff check app/

      - name: Test
        working-directory: app
        run: pytest --cov=. --cov-report=term-missing

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit dependencies
        run: |
          pip install pip-audit==2.7.3
          pip-audit --requirement app/requirements.txt --desc

      - name: Build image
        run: docker build -t task-api:${{ github.sha }} .

      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: task-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Format check
        run: terraform fmt -check -recursive terraform/

      - name: Validate
        run: |
          for dir in terraform/bootstrap terraform/envs/* terraform/modules/*; do
            terraform -chdir="$dir" init -backend=false -input=false > /dev/null
            terraform -chdir="$dir" validate
          done
