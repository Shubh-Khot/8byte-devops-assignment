name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: taskapi

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push
        id: push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:sha-${GITHUB_SHA::7}"
          docker build --build-arg BUILD_SHA="$GITHUB_SHA" -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  staging:
    name: Deploy to staging
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update service
        run: scripts/deploy.sh taskapi-staging-cluster taskapi-staging-service "${{ needs.build.outputs.image }}"

      - name: Smoke test
        run: |
          URL=$(aws elbv2 describe-load-balancers \
            --names taskapi-staging-alb \
            --query 'LoadBalancers[0].DNSName' --output text)
          scripts/smoke-test.sh "http://$URL" "${{ github.sha }}"

  production:
    name: Deploy to production
    needs: [build, staging]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update service
        run: scripts/deploy.sh taskapi-prod-cluster taskapi-prod-service "${{ needs.build.outputs.image }}"

      - name: Smoke test
        run: |
          URL=$(aws elbv2 describe-load-balancers \
            --names taskapi-prod-alb \
            --query 'LoadBalancers[0].DNSName' --output text)
          scripts/smoke-test.sh "http://$URL" "${{ github.sha }}"
