# Single-binary Loki, filesystem storage. Correct for a laptop, wrong for
# production - there the same configuration points at S3 and runs the
# read/write/backend components separately.
#
# Loki indexes only labels, not log contents. That is the whole reason it is
# cheap enough to keep all application logs: the bytes go to object storage
# and only the small label index is hot.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Docker log timestamps can lag; without this, a container that buffers for
  # a few seconds has its lines silently rejected as too old.
  reject_old_samples: false
  max_query_series: 5000
  volume_enabled: true
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

table_manager:
  retention_deletes_enabled: true
  retention_period: 168h # 7 days locally; 30 in staging, 90 in prod
