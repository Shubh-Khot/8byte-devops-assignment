
groups:
  - name: availability
    rules:
      - alert: ServiceDown
        expr: up{job="task-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "task-api is not responding to scrapes"
          description: "Prometheus has been unable to scrape {{ $labels.instance }} for over a minute."

      - alert: DatabaseUnreachable
        expr: app_database_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Application cannot reach Postgres"
          description: "readyz has been failing for 2 minutes; the ALB will have drained these tasks."

  - name: latency-and-errors
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_requests_total[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Over 5% of requests are failing"
          description: "5xx ratio is {{ $value | humanizePercentage }} over the last 5 minutes."

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(
            0.99,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le)
          ) > 1.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p99 latency above 1.5s"
          description: "p99 is {{ $value | humanizeDuration }}."

      - alert: EndpointLatencyRegression
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(http_request_duration_seconds_bucket[5m])) by (le, path)
          ) > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.path }} p95 is above 2s"

  - name: saturation
    rules:
      - alert: RequestsPilingUp
        expr: http_requests_in_flight > 50
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Requests are queueing up ({{ $value }} in flight)"

      - alert: PostgresConnectionsHigh
        expr: |
          sum(pg_stat_activity_count) > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres connection count is high"
          description: "{{ $value }} connections. Usually a leaked pool, not real load."

      - alert: HostDiskFillingUp
        expr: |
          (
            node_filesystem_avail_bytes{mountpoint="/"}
            / node_filesystem_size_bytes{mountpoint="/"}
          ) < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Less than 15% disk free on {{ $labels.instance }}"

      - alert: HostMemoryPressure
        expr: |
          (
            1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes
          ) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory above 90% on {{ $labels.instance }}"
