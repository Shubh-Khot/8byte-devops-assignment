
global:
  resolve_timeout: 5m

route:
  receiver: slack
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - matchers: ['severity="critical"']
      receiver: slack
      group_wait: 10s
      repeat_interval: 1h

inhibit_rules:
  - source_matchers: ['alertname="ServiceDown"']
    target_matchers: ['severity=~"warning|critical"']
    equal: ["service"]

receivers:
  - name: slack
    slack_configs:
      - api_url_file: /etc/alertmanager/slack_url
        channel: "#alerts"
        send_resolved: true
        title: '{{ if eq .Status "firing" }}:rotating_light:{{ else }}:white_check_mark:{{ end }} {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
